name: Add BSO volume control in Settings
on:
  push:
    paths:
      - ".github/workflows/add-bso-volume-settings.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add persistent music volume slider
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          marker='<section id="narratorSettingsPanel" class="panel settings-panel-content">\n    <div class="panel-pad">'
          assert html.count(marker)==1, 'Settings marker missing or duplicated'
          html_section = '''
              <section class="lm-bso-volume-setting" aria-labelledby="lmBsoVolumeTitle">
                <div class="lm-bso-volume-header">
                  <label id="lmBsoVolumeTitle" for="scenarioBsoVolume">🎵 Volumen de la BSO</label>
                  <output id="scenarioBsoVolumeOutput" for="scenarioBsoVolume">78%</output>
                </div>
                <input id="scenarioBsoVolume" type="range" min="0" max="100" step="1" value="78" aria-label="Volumen de la banda sonora de 0 a 100 por ciento">
                <p>Sube o baja la música de fondo. No modifica el volumen de las narraciones. El nivel queda guardado para la próxima partida.</p>
              </section>'''
          if 'id="scenarioBsoVolume"' not in html:
            html=html.replace(marker,marker+'\n'+html_section,1)
          styling='''
          <style id="lm-bso-volume-settings-style">
          .lm-bso-volume-setting{margin:6px 0 18px;padding:18px 20px;border:1px solid rgba(137,207,60,.35);border-radius:15px;background:linear-gradient(135deg,rgba(38,64,34,.30),rgba(13,20,15,.9))}
          .lm-bso-volume-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 12px}
          .lm-bso-volume-header label{margin:0;color:#e4edd2;font-weight:800;font-size:1.18rem}
          #scenarioBsoVolumeOutput{font-size:1.2rem;font-weight:900;color:#a3ed6c;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
          #scenarioBsoVolume{display:block;width:100%;height:25px;accent-color:#8fe058;cursor:pointer;margin:8px 0}
          .lm-bso-volume-setting p{margin:12px 0 0;line-height:1.5;color:#d0d9c7;font-size:.93rem}
          </style>
          '''
          if 'id="lm-bso-volume-settings-style"' not in html:
            assert '</head>' in html
            html=html.replace('</head>',styling+'</head>',1)
          hook='window.LMIntegratedBso=new IntegratedScenarioBso();'
          assert html.count(hook)==1, 'Expected integrated BSO instance exactly once'
          js='''
          /* LM · BSO volume persisted independently from narration volume. */
          const LM_BSO_VOLUME_STORAGE = \`\${BASE_STORE}.bsoVolume\`;
          const lmBsoVolumeValue = localStorage.getItem(LM_BSO_VOLUME_STORAGE);
          if(lmBsoVolumeValue !== null && lmBsoVolumeValue !== ""){
            const saved = Number(lmBsoVolumeValue);
            if(Number.isFinite(saved))window.LMIntegratedBso.baseVolume=clamp(saved,0,1);
          }
          window.LMIntegratedBso.setVolume = function(value){
            const next=Number(value);
            if(!Number.isFinite(next))return;
            this.baseVolume=clamp(next,0,1);
            localStorage.setItem(LM_BSO_VOLUME_STORAGE,String(this.baseVolume));
            // Preserve the original ducking behaviour while spoken narration is active.
            if(this.audio.paused){this.audio.volume=this.target()}
            else this.fadeTo(this.target(),120);
            const slider=byId("scenarioBsoVolume"),output=byId("scenarioBsoVolumeOutput");
            const percentage=Math.round(this.baseVolume*100);
            if(slider&&Number(slider.value)!==percentage)slider.value=String(percentage);
            if(output)output.textContent=\`\${percentage}%\`;
          };
          const lmBsoVolumeSlider=byId("scenarioBsoVolume");
          if(lmBsoVolumeSlider){
            const initialPercent=Math.round(window.LMIntegratedBso.baseVolume*100);
            lmBsoVolumeSlider.value=String(initialPercent);
            const output=byId("scenarioBsoVolumeOutput");
            if(output)output.textContent=\`\${initialPercent}%\`;
            lmBsoVolumeSlider.addEventListener("input",event=>{
              window.LMIntegratedBso.setVolume(Number(event.target.value)/100);
            });
          }
          '''
          if 'LM_BSO_VOLUME_STORAGE' not in html:
            html=html.replace(hook,hook+'\n'+js,1)
          assert 'id="scenarioBsoVolume"' in html
          assert html.count('LM_BSO_VOLUME_STORAGE')>=4
          assert html.count('window.LMIntegratedBso=new IntegratedScenarioBso();')==1
          assert 'function duckSoundtracks(on)' in html
          p.write_text(html,encoding='utf-8')
          print('BSO VOLUME SLIDER INSTALLED; SIZE',p.stat().st_size)
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          js=[m.group(1) for m in re.finditer(r'<script\b[^>]*>(.*?)</script>',html,re.S|re.I) if 'class IntegratedScenarioBso' in m.group(1)]
          assert len(js)==1, len(js)
          Path('/tmp/lm-main.js').write_text(js[0],encoding='utf8')
          PY
          node --check /tmp/lm-main.js
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add saved BSO volume slider to application settings"
          git pull --rebase origin main
          git push
