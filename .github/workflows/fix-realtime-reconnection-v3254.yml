name: Deduplicate Realtime table reconnection v3.2.54
on:
  push:
    paths:
      - ".github/workflows/fix-realtime-reconnection-v3254.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicate table claim after reconnect
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          c=p.read_text(encoding='utf-8')
          t='if(publicAssignedTable)send(conn,{type:"claim_table",tableId:publicAssignedTable})'
          old=t+';send(conn,{type:"request_state"});'+t
          new=t+';send(conn,{type:"request_state"})'
          if old in c:
              c=c.replace(old,new,1)
          assert old not in c
          assert new in c
          assert 'epic-supabase-transport.js?v=3.2.54' in c
          assert 'peerjs.min.js' not in c
          p.write_text(c,encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deduplicate epic table reconnection claim"
          git pull --rebase origin main
          git push
