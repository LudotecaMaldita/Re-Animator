name: Publish mobile player two-tab screen
on:
  push:
    paths: [".github/workflows/publish-player-tabs-v3260.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable dedicated player tabs and countdown
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="player-tabs-v3260.css?v=3.2.60">'
          js='<script src="player-tabs-v3260.js?v=3.2.60"></script>'
          assert Path('player-tabs-v3260.css').is_file() and Path('player-tabs-v3260.js').is_file()
          assert 'player-mobile-v3259.css' in s
          assert 'epic-supabase-transport.js' in s
          assert '</head>' in s and '</body></html>' in s
          if css not in s:s=s.replace('</head>',css+'\n</head>',1)
          if js not in s:s=s.replace('</body></html>',js+'\n</body></html>',1)
          assert s.count(css)==1 and s.count(js)==1
          p.write_text(s,encoding='utf-8')
          subprocess.run(['node','--check','player-tabs-v3260.js'],check=True)
          print('Mobile player tabs successfully linked and JavaScript valid')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "Publish mobile player tabs and corrected live countdown"
          git pull --rebase origin main
          git push
