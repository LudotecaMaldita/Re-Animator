name: Fix public screen visibility and typography v3.2.61
on:
  push:
    paths: [".github/workflows/fix-public-screen-v3261.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HTML cache version and public-only overrides
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          t=p.read_text(encoding="utf8")
          old='public-screen-layout-v3257.css?v=3.2.57'
          new='public-screen-layout-v3257.css?v=3.2.61'
          assert old in t or new in t
          t=t.replace(old,new)
          block='''<style id="lm-public-fix-3261">
          /* Never hide the Director's announcement, only the public projection. */
          html body.mode-screen:not(.table-client) section.panel.announcement-panel,
          html body.mode-screen.public-general-view section.panel.announcement-panel,
          html body.mode-screen:not(.table-client) section:has(#announcementTitle) {
            display:none!important;visibility:hidden!important;
            position:absolute!important;width:0!important;height:0!important;
            min-width:0!important;min-height:0!important;overflow:hidden!important;
            padding:0!important;margin:0!important;border:0!important;
          }
          html body.mode-screen:not(.table-client) main>div.event-director-only:not(#directorQuickbar){
            display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,2fr)!important;
            grid-template-rows:minmax(155px,auto) minmax(0,1fr)!important;
            min-height:calc(100dvh - 120px)!important;
            gap:10px!important;
          }
          html body.mode-screen:not(.table-client) main>div.event-director-only:not(#directorQuickbar)>.outcome-panel{
            grid-column:1!important;grid-row:2!important;
            min-height:calc(100dvh - 330px)!important;overflow:auto!important;
          }
          html body.mode-screen:not(.table-client) main>div.event-director-only:not(#directorQuickbar)>.global-panel{
            grid-column:2!important;grid-row:2!important;
            min-height:calc(100dvh - 330px)!important;overflow:auto!important;
          }
          html body.mode-screen:not(.table-client) :is(.outcome-panel,.global-panel) :is(p,li,span,small,.note,.condition,.condition *,[class*="milestone"],[class*="crisis"],[class*="hito"]){
            font-size:clamp(22px,1.55vw,32px)!important;line-height:1.4!important;
          }
          html body.mode-screen:not(.table-client) :is(.outcome-panel,.global-panel) :is(h2,h3){
            font-size:clamp(38px,3.15vw,62px)!important;line-height:1.18!important;
          }
          html body.mode-screen:not(.table-client) :is(.outcome-panel,.global-panel) .eyebrow{
            font-size:clamp(24px,1.8vw,35px)!important;
          }
          @media(max-width:800px){
            html body.mode-screen:not(.table-client) main>div.event-director-only:not(#directorQuickbar){
              grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto auto auto!important;
              min-height:0!important;
            }
            html body.mode-screen:not(.table-client) main>div.event-director-only:not(#directorQuickbar)>.outcome-panel{
              grid-column:1!important;grid-row:2!important;min-height:0!important;
            }
            html body.mode-screen:not(.table-client) main>div.event-director-only:not(#directorQuickbar)>.global-panel{
              grid-column:1!important;grid-row:3!important;min-height:0!important;
            }
          }
          </style>'''
          if 'id="lm-public-fix-3261"' not in t:
            t=t.replace('</body></html>',block+'\n</body></html>')
          assert new in t and 'id="lm-public-fix-3261"' in t
          p.write_text(t,encoding="utf8")
          print("Verified HTML has new CSS cache buster and public-only hidden announcement")
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix cached stylesheet and remove public announcement visibly"
          git pull --rebase origin main
          git push
