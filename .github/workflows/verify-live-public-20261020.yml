name: Verify live public screen visibility
on:
  push:
    paths:
      - ".github/workflows/verify-live-public-20261020.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test
        run: |
          npm install --prefix /tmp/lm-public-test playwright@1.56.1 --silent
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null && ! command -v chromium >/dev/null; then
            /tmp/lm-public-test/node_modules/.bin/playwright install chromium
          fi
      - name: Test live GitHub Pages after forced reload
        shell: bash
        run: |
          cat > /tmp/lm-public-test/verify.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const options={headless:true};
            const chrome=process.env.CHROME_BIN||['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(p=>require('fs').existsSync(p));
            if(chrome)options.executablePath=chrome;
            const browser=await chromium.launch(options);
            const page=await browser.newPage({viewport:{width:1920,height:1080}});
            const url='https://ludotecamaldita.github.io/Re-Animator/?mode=screen&scenario=west&refresh='+Date.now();
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2500);
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForTimeout(2000);
            const report=await page.evaluate(()=>{
              const body=document.body;
              body.classList.add('mode-screen','public-general-view');
              body.classList.remove('mode-director','table-client');
              const q=s=>document.querySelector(s);
              const stat=el=>el?{display:getComputedStyle(el).display,visibility:getComputedStyle(el).visibility,rect:Math.round(el.getBoundingClientRect().width)+'x'+Math.round(el.getBoundingClientRect().height),fontSize:getComputedStyle(el).fontSize}:null;
              const ann=q('section.panel.announcement-panel');
              const outcome=q('main .outcome-panel');
              const global=q('main .global-panel');
              const stylesheet=[...document.querySelectorAll('link[rel=stylesheet]')].map(x=>({url:x.href,sheet:!!x.sheet}));
              return {bodyClass:body.className,announcement:stat(ann),eventTitle:q('#announcementTitle')?.textContent,result:stat(outcome),state:stat(global),resultHeading:stat(outcome?.querySelector('h2')),resultDetail:stat(outcome?.querySelector('p:not(.eyebrow)')),stateHeading:stat(global?.querySelector('h2')),stateDetail:stat(global?.querySelector('p:not(.eyebrow)')),css:stylesheet};
            });
            console.log('LIVE PUBLIC SCREEN',JSON.stringify({status:res.status(),report},null,2));
            await browser.close();
            if(!report.announcement||report.announcement.display!=='none')process.exit(5);
            if(!report.result||!report.state)process.exit(6);
            const a=parseInt(report.result.rect),b=parseInt(report.state.rect);
            if(b<a*1.6)process.exit(7);
            if(report.resultHeading&&parseInt(report.resultHeading.fontSize)<30)process.exit(8);
            console.log('LIVE_PUBLIC_VERIFIED');
          })().catch(e=>{console.error(e);process.exit(2)})
          NODE
          node /tmp/lm-public-test/verify.cjs
