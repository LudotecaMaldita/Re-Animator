name: Bust public screen stylesheet cache
on:
  push:
    paths:
      - ".github/workflows/refresh-public-screen-css-20261020.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public CSS version
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          t=p.read_text(encoding="utf8")
          old='public-screen-layout-v3257.css?v=3.2.57'
          new='public-screen-layout-v3257.css?v=20261020-1536'
          assert old in t or new in t, "Public stylesheet reference missing"
          t=t.replace(old,new)
          assert t.count(new)==1
          assert 'player-tabs-v3260.js' in t
          assert 'epic-mode-flow-v3256.js' in t
          p.write_text(t,encoding="utf8")
          print('PUBLIC_STYLESHEET_CACHE_UPDATED',new)
      - name: Commit public CSS cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public screen CSS for users after reload"
          git pull --rebase origin main
          git push
