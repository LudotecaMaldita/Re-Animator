name: Apply QR links new tab v3.2.54

on:
  push:
    paths:
      - ".github/workflows/apply-qr-new-tab-v3254.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          p=Path("index.html")
          c=p.read_text(encoding="utf-8")

          old='''async function openPublicSharePanel(){
            const room=await ensurePublicRoom();
            if(room===null)return;
            renderPublicSharePanel(room);
          }'''

          new=r'''async function openPublicSharePanel(){
            const popup=window.open("about:blank","_blank");
            if(!popup){
              toast("El navegador ha bloqueado la nueva pestaña. Permite ventanas emergentes para esta página.");
              return;
            }
            try{
              popup.document.title="Ludoteca Maldita · QR y enlaces";
              popup.document.body.innerHTML='<div style="font-family:system-ui,sans-serif;background:#090b09;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0;text-align:center;padding:24px"><div><div style="font-size:42px">🔗</div><h1 style="font-size:22px">Preparando QR de la partida…</h1><p style="opacity:.72">Mantén abierto el Director Épico en la pestaña anterior.</p></div></div>';
            }catch(e){}

            const room=await ensurePublicRoom();
            if(room===null){
              try{popup.close()}catch(e){}
              return;
            }

            const generalUrl=buildPublicAccessUrl(room);
            const tableCount=Math.max(1,Number(directorState?.M)||1);
            const items=[{label:"QR GENERAL · ELIGE TU MESA",url:generalUrl,general:true}];
            for(let i=1;i<=tableCount;i++){
              items.push({
                label:`MESA ${i}`,
                url:generalUrl+(generalUrl.includes("?")?"&":"?")+`table=${i}`,
                general:false
              });
            }

            const h=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
            const cards=items.map((item,i)=>`
              <article class="qr-card ${item.general?"general":""}">
                <h2>${h(item.label)}</h2>
                <div id="lmQrTab_${i}" class="qr-box"></div>
                <p class="url">${h(item.url)}</p>
                <div class="actions">
                  <button type="button" data-copy="${i}">Copiar enlace</button>
                  <a href="${h(item.url)}" target="_blank" rel="noopener">Abrir</a>
                </div>
              </article>`).join("");

            const html=`<!doctype html>
            <html lang="es">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>Ludoteca Maldita · QR y enlaces</title>
              <style>
                *{box-sizing:border-box}
                body{margin:0;background:radial-gradient(circle at 50% 0,#172016 0,#080a08 42%,#020302 100%);color:#f2ead1;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
                header{position:sticky;top:0;z-index:2;padding:18px 20px;border-bottom:1px solid rgba(218,197,126,.3);background:rgba(5,7,5,.94);backdrop-filter:blur(12px);text-align:center}
                header h1{margin:0 0 4px;font-size:clamp(22px,4vw,36px);letter-spacing:.04em}
                header p{margin:0;color:#acb7a7;font-size:14px}
                .grid{width:min(1280px,calc(100% - 28px));margin:22px auto 38px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
                .qr-card{background:linear-gradient(180deg,rgba(24,29,22,.97),rgba(8,10,8,.98));border:1px solid rgba(214,194,124,.28);border-radius:15px;padding:18px;text-align:center;box-shadow:0 18px 45px rgba(0,0,0,.3)}
                .qr-card.general{grid-column:1/-1;border-color:rgba(120,224,93,.45);background:linear-gradient(180deg,rgba(25,43,24,.98),rgba(8,14,8,.98))}
                .qr-card h2{font-size:17px;margin:0 0 14px;letter-spacing:.055em}
                .qr-box{width:232px;height:232px;max-width:100%;margin:0 auto 13px;padding:6px;display:grid;place-items:center;background:#fff;border-radius:10px}
                .qr-box img,.qr-box canvas{max-width:100%!important;height:auto!important}
                .url{font-size:11px;line-height:1.35;color:#9fa99a;word-break:break-all;min-height:44px;margin:8px 0 12px}
                .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
                button,a{appearance:none;border:1px solid rgba(217,198,130,.38);border-radius:9px;padding:9px 12px;background:#171b15;color:#f2ead1;text-decoration:none;font-weight:700;cursor:pointer;font-size:13px}
                button:hover,a:hover{background:#263222}
                .note{width:min(900px,calc(100% - 28px));margin:20px auto 0;padding:12px 16px;border:1px solid rgba(105,212,86,.25);border-radius:12px;background:rgba(26,55,24,.3);color:#cbd8c7;text-align:center;font-size:13px}
                @media(max-width:620px){.grid{grid-template-columns:1fr}.qr-box{width:210px;height:210px}}
              </style>
            </head>
            <body>
              <header>
                <h1>QR Y ENLACES · MULTIJUGADOR ÉPICO</h1>
                <p>Esta pestaña puede permanecer abierta. El Director Épico continúa en la pestaña anterior.</p>
              </header>
              <div class="note">El QR general permite elegir mesa. Los QR de mesa entran directamente en la mesa indicada.</div>
              <main class="grid">${cards}</main>
            </body>
            </html>`;

            popup.document.open();
            popup.document.write(html);
            popup.document.close();

            items.forEach((item,i)=>{
              const box=popup.document.getElementById(`lmQrTab_${i}`);
              if(!box)return;
              try{
                if(typeof QRCode==="function"){
                  new QRCode(box,{text:item.url,width:220,height:220,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
                }else{
                  box.innerHTML='<div style="color:#111;padding:20px;font-weight:700">QR no disponible.<br>Usa el enlace inferior.</div>';
                }
              }catch(e){
                console.warn("No se pudo generar QR",e);
                box.innerHTML='<div style="color:#111;padding:20px;font-weight:700">QR no disponible.<br>Usa el enlace inferior.</div>';
              }
            });

            popup.document.querySelectorAll("[data-copy]").forEach(btn=>btn.addEventListener("click",async()=>{
              const item=items[Number(btn.dataset.copy)];
              try{
                await navigator.clipboard.writeText(item.url);
                const prev=btn.textContent;btn.textContent="✓ Copiado";
                setTimeout(()=>btn.textContent=prev,1200);
              }catch(e){
                popup.prompt("Copia este enlace:",item.url);
              }
            }));
          }'''

          if old not in c:
              if 'QR Y ENLACES · MULTIJUGADOR ÉPICO' in c:
                  print("La función ya parece actualizada")
              else:
                  raise SystemExit("No se encontró openPublicSharePanel esperado")
          else:
              c=c.replace(old,new,1)

          c=c.replace('const APP_VERSION="3.2.53";','const APP_VERSION="3.2.54";',1)
          c=c.replace('<span>v3.2.53 · Fanmade · Ludoteca Maldita</span>','<span>v3.2.54 · Fanmade · Ludoteca Maldita</span>',1)
          c=c.replace('Aplicación v3.2.53<br>','Aplicación v3.2.54<br>',1)

          p.write_text(c,encoding="utf-8")

      - name: Validate JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          c=Path("index.html").read_text(encoding="utf-8")
          assert 'const APP_VERSION="3.2.54";' in c
          assert 'QR Y ENLACES · MULTIJUGADOR ÉPICO' in c
          assert 'const popup=window.open("about:blank","_blank");' in c
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',c,re.S|re.I)
          for i,s in enumerate(scripts):
              if not s.strip():
                  continue
              f=Path(tempfile.gettempdir())/f"lm-v3254-{i}.js"
              f.write_text(s,encoding="utf-8")
              subprocess.run(["node","--check",str(f)],check=True)

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Open QR links in a separate tab"
          git push
